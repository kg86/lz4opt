[package]
name = "lz4opt"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "LZ4 frame encoder with optimal parsing, and an LZ77 encoder, built on sliding suffix trees"
license-file = "LICENSE"
publish = false

[dependencies]
miniz_oxide = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
snakree = { git = "https://github.com/kg86/snakree.git" }
